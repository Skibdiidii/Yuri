version: '3.8'

services:
  harumi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harumi_bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DATABASE_URL=file:./dev.db
      - AI_API_ENDPOINT=https://api.openai.com/v1
      - AI_MODEL=gpt-4o-mini
      - AI_KEY=${AI_KEY:-B4uCaEJo9ZCuZo5Am6BpAwt30lP86WMu}
      - PORT=3000
    volumes:
      - harumi_data:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  harumi_data:
